<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinic CRM – by Quantamloop Innovation{% endblock %}</title>
  {% block meta %}
  <meta name="robots" content="noindex, nofollow">
  {% endblock %}
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2E4435">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="/static/css/main.css?v=30">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="submit-overlay" class="submit-overlay" hidden aria-hidden="true">
    <span class="submit-overlay-spinner" aria-hidden="true"></span>
    <span class="sr-only">Loading</span>
  </div>
  {% block body %}{% endblock %}
</body>
</html>
